# Rebuilds content/manifest.js from the content/ folders and publishes the site to GitHub Pages.
# Runs on every push to main (so engine/design changes go live too) and by hand (Actions → Run workflow).
# If the manifest changed, it is committed back with [skip ci] so the repo matches the live site.
name: Build content and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build content manifest
        run: node tools/build-content.mjs
      - name: Commit manifest if it changed
        run: |
          if git diff --quiet -- content/manifest.js content/manifest.json; then
            echo "Manifest already up to date."
          else
            git config user.name "pointlab-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/manifest.js content/manifest.json
            git commit -m "Update content manifest [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .   # .git and .github are left out automatically

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
